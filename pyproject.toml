[project]
name = "official-web-agent"
version = "0.1.0"
description = "博远信息技术社招新 AI Agent:招新对话助理 × 简历评估流水线 × 面试官 Copilot"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "langfuse>=2.60",
    "typer>=0.15",
    "rich>=13",
    "langchain>=1.0",
    "langchain-openai>=1.6.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "respx>=0.22",
]

[project.scripts]
official-agent = "official_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/official_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
