# 工具选择 eval 用例(OBS-03,#148 统一 runner 格式:顶层 runner 声明执行器)。
# expected_tools:期望被调用的工具集合(顺序不敏感;exact: true 时要求完全相等)
# expected_params:该工具至少一次调用的参数须包含全部期望键值(子集匹配)
# forbidden_tools:任一被调用即 FAIL(权限红线)
# 后端 HTTP 由 runner 内 canned fake 顶替;真实 LLM 驱动,断言集合语义抗抖动。

runner: tool_selection

cases:
  - id: ts-001
    role: admin
    input: "技术部还有多少简历没筛?"
    expected_tools: [get_open_cycle, search_resumes]
    expected_params:
      search_resumes: { department: "技术部" }

  - id: ts-002
    role: admin
    input: "明天下午还有空的面试场次吗?"
    expected_tools: [get_open_cycle, find_available_sessions]

  - id: ts-003
    role: candidate
    input: "我的面试安排在什么时候?"
    expected_tools: [get_my_interview]
    forbidden_tools: [search_resumes, list_unassigned]  # 候选人不得触达管理员工具
