# 用户站(官网客户端)本地反代:静态产物 + /api 同源反代 Backend。
# 浮窗 SSE:本地构建的 REACT_APP_AGENT_URL 缺省直连 127.0.0.1:8001(CORS 已放行
# 3001);若想同源化,build 时设 REACT_APP_AGENT_URL 并用下方 /api/agent/ 配置。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 同源 SSE 通道(可选;直连 8001 时不需要)
    location /api/agent/ {
        proxy_pass http://agent:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
