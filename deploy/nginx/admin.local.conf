# 管理面板本地反代(与生产片段 deploy/nginx/agent.prod.conf.example 同一拓扑):
# 静态产物 + /api 同源反代 Backend;/api/agent/ 反代 Agent(SSE 调优)。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 普通管理 API → Backend(V37 权限校验 + #115 代理)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 客服 Agent(SSE 契约 #90)→ Agent 容器。
    # SSE 三件套(#116 AC):proxy_buffering off + 长超时 + HTTP/1.1 清 Connection。
    # 用户站浮窗同源通道(REACT_APP_AGENT_URL 留空时走此路径);管理面板经
    # Backend 代理不走这里。限流预留位(SEC-05/#56 定后接):在 location 内
    # 加 limit_req + 上方 limit_req_zone 定义。
    location /api/agent/ {
        proxy_pass http://agent:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
