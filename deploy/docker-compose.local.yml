# 本地整栈联调(M6 #116):一键起 agent + backend + 管理面板 + 全部依赖。
# 与 Backend 仓库自带 compose 的关系:二选一,勿同时跑(共用 mysql 数据卷)。
#
# 前置(一次性):
#   1. Backend 打包:cd ../../Official_Web_Backend && mvn -q package -DskipTests
#      (Backend Dockerfile 拷 target/Official-*.jar,仿其服务器构建先例)
#   2. 前端产物:cd ../../Official_Web_Frontend && npx craco build
#      (REACT_APP_API_URL 不设 = 同源相对路径,由本栈 nginx 反代)
#   3. Agent 密钥:本文件经 env_file 读仓库根 .env(LLM key 等),不进镜像
#
# 用法:docker compose -f deploy/docker-compose.local.yml up -d --build
# 验证:见 deploy/README.md
name: official-agent-local

services:
  # ── Agent 自有 PG(ADR-0007:checkpointer/审计/conversation_log 唯一存储)──
  agent-pg:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: agent_dev
      POSTGRES_DB: official_agent
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d official_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend 依赖(端口仅容器内;宿主机调试走 backend:8080 映射)──
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: official
    # 复用 Backend 仓库既有数据卷(保留历史联调账号);勿与旧 compose 同时启动
    volumes:
      - ../../Official_Web_Backend/volumes/mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"   # 宿主机 SQL 客户端可直连(提权账号用)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # 非 guest 用户:guest 只允许 localhost 连接,跨容器必被拒(2026-09-05 实测踩坑)
    environment:
      RABBITMQ_DEFAULT_USER: official
      RABBITMQ_DEFAULT_PASS: official
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend(挂载本地打包的 jar;不 build 镜像 —— 本地对 ubuntu 源 502,
  #    装字体的 apt 层过不去;PDF 字体层只有生产镜像需要)──
  #    jar 重新打包后重启本服务即可生效:docker compose -f ... restart backend
  backend:
    image: eclipse-temurin:17-jre-jammy
    working_dir: /srv
    volumes:
      - ../../Official_Web_Backend/target/Official-1.0.0.jar:/srv/app.jar:ro
    command: ["java", "-jar", "/srv/app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/official?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: official
      SPRING_RABBITMQ_PASSWORD: official
      # M6 #115:管理代理指向 agent(compose 内网名)
      AGENT_BASE_URL: http://agent:8001/api/agent
      # JWT 签名密钥(本地联调值;生产由服务器 env 提供,须 ≥256bit)
      JWT_SECRET: local-dev-secret-0123456789abcdef0123456789abcdef
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Agent(独立容器,#116;单 worker 起步,无状态可多副本)──
  agent:
    build: ..
    image: official-agent:local
    env_file:
      - ../.env                 # LLM key 等密钥只走 env,不进镜像(SEC-01)
    environment:
      BACKEND_BASE_URL: http://backend:8080
      POSTGRES_URL: postgresql://postgres:agent_dev@agent-pg:5432/official_agent
      AGENT_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      LANGFUSE_HOST: ""         # 本地栈不起 langfuse(fail-open,ADR-0005);要观测另起 deploy/langfuse
      CREDENTIALS_DIR: /app
    ports:
      - "127.0.0.1:8001:8001"   # 用户站浮窗直连通道(REACT_APP_AGENT_URL 默认值)
    volumes:
      - ./logs:/app/logs        # RotatingFileHandler 落盘(#116 AC)
    depends_on:
      agent-pg:
        condition: service_healthy

  # ── 管理面板(admin 模式,3000)与官网客户端(user 模式,3001)──
  admin-web:
    image: nginx:alpine
    volumes:
      - ./nginx/admin.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../Official_Web_Frontend/build-admin:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
      - agent

  user-web:
    image: nginx:alpine
    volumes:
      - ./nginx/user.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../Official_Web_Frontend/build-user:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
      - agent

volumes:
  agent_pg_data:
